services:
  api_host: "localhost"
  api_base_path: "/nomad-oasis"

oasis:
  is_oasis: true
  uses_central_user_management: true

plugins:
  entry_points:
    options:
      nomad_north_jupyter.north_tools:jupyter:
        north_tool:
          image: ghcr.io/fairmat-nfdi/nomad-north-jupyter:latest
      nomad_camels_oasis.entry_points:camels:
        # Replace this with the address reachable from the NOMAD app container.
        # Configure the key through /nomad-oasis/camels/setup. A CAMELS_API_KEY
        # environment variable remains supported for unattended deployments.
        camels_base_url: "http://host.docker.internal:8000"
        request_timeout_seconds: 10

meta:
  deployment: "oasis"
  deployment_url: "https://my-oasis.org/api"
  maintainer_email: "me@my-oasis.org"

logstash:
  enabled: false

temporal:
  enabled: true

mongo:
  db_name: nomad_oasis_v1

elastic:
  entries_index: nomad_oasis_entries_v1
  materials_index: nomad_oasis_materials_v1

north:
  enabled: true
  enable_new_hub_api: true
